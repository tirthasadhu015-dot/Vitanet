{% extends "base.html" %}

{% block title %}Hospital Registration | Vitanet{% endblock %}

{% block content %}
<section class="form-card" aria-labelledby="hospital-heading">
    <p class="eyebrow">Hospital portal</p>
    <h1 id="hospital-heading">Register your hospital</h1>
    <p class="intro">
        Create your hospital account first. Complete the profile and run the
        AI-assisted verification from your secure dashboard.
    </p>

    <form action="{{ url_for('register_hospital') }}" method="post">
        <div class="form-grid">
            <div class="field field-full">
                <label for="name">Hospital name</label>
                <input id="name" name="name" type="text" required>
            </div>

            <div class="field">
                <label for="license_no">License number</label>
                <input id="license_no" name="license_no" type="text" required>
            </div>

            <div class="field">
                <label for="email">Registration email</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="field field-full">
                <label for="location">Location</label>
                <input id="location" name="location" type="text" required>
            </div>

            <div class="field">
                <label for="password">Create password</label>
                <input id="password" name="password" type="password"
                       minlength="8" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="password_confirm">Confirm password</label>
                <input id="password_confirm" name="password_confirm"
                       type="password" minlength="8"
                       autocomplete="new-password" required>
            </div>
        </div>

        <button class="button" type="submit">Create hospital account</button>
    </form>
</section>
{% endblock %}
